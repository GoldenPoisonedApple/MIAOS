name: CD Build

# semver tag push 時のみイメージをビルドする（本番リリースの正）
# release-please が PAT で tag を作成すると起動する（GITHUB_TOKEN の tag push では起動しない）

concurrency:
  group: cd-build-${{ github.ref }}
  cancel-in-progress: false # CDはキャンセルしない 段階リリースのような順序補償が必要な場合がある 中断による不整合を防ぐ

on:
  # semver tag push 時に起動
  push:
    tags: ['v*.*.*']

permissions:
  contents: read

env:
  REGISTRY: ghcr.io

jobs:
  # ─────────────────────────────────────────
  # イメージビルド & Push
  # ─────────────────────────────────────────
  build-orchestrator-backend:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write # ghcr.io push / buildcache に必要
    steps:
      # ソースコードを実行環境にチェックアウト
      - uses: actions/checkout@v4
      # docker buildx(高性能ビルド環境)初期化
      - uses: docker/setup-buildx-action@v3
      # ghcr.ioにログイン
      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      # GHCR はリポジトリ名を小文字に正規化する
      - name: Set image repository
        run: echo "IMAGE_REPO=${{ env.REGISTRY }}/${GITHUB_REPOSITORY,,}" >> "$GITHUB_ENV"

      # イメージのメタデータ自動生成
      - id: meta
        uses: docker/metadata-action@v5
        with: 
          # イメージの名前を指定
          images: ${{ env.REGISTRY }}/${{ github.repository }}/orchestrator-backend
          # sha: コミット単位で一意なハッシュを付与
          # latest: latestタグをつける 1つのタグは常に1つのイメージしかさせないため常に最新版を指す
          tags: |
            type=sha,prefix=,format=short
            type=raw,value=latest 

      # イメージのビルドとpush
      - id: build
        uses: docker/build-push-action@v6
        with:
          # ビルド対象
          context: orchestrator/backend
          # ビルド環境
          target: prod
          push: true
          # メタデータで生成したタグを使用
          tags: ${{ steps.meta.outputs.tags }}
          # メタ情報 Git commit, repo URL など
          labels: ${{ steps.meta.outputs.labels }}
          # ビルドキャッシュ: GHCR の専用タグに read/write（tag 間・ブランチをまたいで共有可能）
          # mode=max: マルチステージの中間レイヤーも含めてキャッシュ
          cache-from: type=registry,ref=${{ env.IMAGE_REPO }}/orchestrator-backend:buildcache
          cache-to: type=registry,ref=${{ env.IMAGE_REPO }}/orchestrator-backend:buildcache,mode=max

  build-orchestrator-frontend:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write # ghcr.io push / buildcache に必要
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Set image repository
        run: echo "IMAGE_REPO=${{ env.REGISTRY }}/${GITHUB_REPOSITORY,,}" >> "$GITHUB_ENV"
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ github.repository }}/orchestrator-frontend
          tags: |
            type=sha,prefix=,format=short
            type=raw,value=latest
      - id: build
        uses: docker/build-push-action@v6
        with:
          context: orchestrator/frontend
          target: prod
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=registry,ref=${{ env.IMAGE_REPO }}/orchestrator-frontend:buildcache
          cache-to: type=registry,ref=${{ env.IMAGE_REPO }}/orchestrator-frontend:buildcache,mode=max

  # NGC PyTorch ベースはアーキあたり ~10GB 級のため、マルチアーキは matrix でジョブ分離し各 runner のディスクを専有する
  build-worker:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write # ghcr.io push / buildcache に必要
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux/amd64
            cache_suffix: amd64
          - platform: linux/arm64
            cache_suffix: arm64
    steps:
      - uses: actions/checkout@v4

      # runner の空きディスク確保（CI worker-prod-build と同等 + 追加オプション）
      - uses: jlumbroso/free-disk-space@main
        with:
          tool-cache: true
          android: true
          dotnet: true
          haskell: true
          large-packages: true
          docker-images: true
          swap-storage: true

      # arm64 ワーカー向けクロスビルド用（ubuntu-latest は amd64）
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Set image repository
        run: echo "IMAGE_REPO=${{ env.REGISTRY }}/${GITHUB_REPOSITORY,,}" >> "$GITHUB_ENV"
      - id: meta
        uses: docker/metadata-action@v5
        with:
          # GHCR は小文字リポジトリ名必須（merge-worker の digest 参照と一致させる）
          images: ${{ env.IMAGE_REPO }}/worker
          tags: |
            type=sha,prefix=,format=short
            type=raw,value=latest
      - id: build
        uses: docker/build-push-action@v6
        with:
          context: worker
          target: prod
          platforms: ${{ matrix.platform }}
          labels: ${{ steps.meta.outputs.labels }}
          # digest 単位で push し、merge-worker でマルチアーキ manifest を組み立てる
          # name= で push 先を明示しないと merge の digest 参照が not found になる
          outputs: type=image,name=${{ env.IMAGE_REPO }}/worker,push=true,push-by-digest=true,name-canonical=true
          cache-from: type=registry,ref=${{ env.IMAGE_REPO }}/worker:buildcache-${{ matrix.cache_suffix }}
          cache-to: type=registry,ref=${{ env.IMAGE_REPO }}/worker:buildcache-${{ matrix.cache_suffix }},mode=max

      - name: Export digest
        run: |
          mkdir -p "${{ runner.temp }}/digests"
          digest="${{ steps.build.outputs.digest }}"
          touch "${{ runner.temp }}/digests/${digest#sha256:}"

      - name: Upload digest
        uses: actions/upload-artifact@v4
        with:
          name: digests-${{ matrix.cache_suffix }}
          path: ${{ runner.temp }}/digests/*
          if-no-files-found: error

  merge-worker:
    runs-on: ubuntu-latest
    needs: build-worker
    permissions:
      contents: read
      packages: write # ghcr.io push に必要
    steps:
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Set image repository
        run: echo "IMAGE_REPO=${{ env.REGISTRY }}/${GITHUB_REPOSITORY,,}" >> "$GITHUB_ENV"
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE_REPO }}/worker
          tags: |
            type=sha,prefix=,format=short
            type=raw,value=latest
      - name: Download digests
        uses: actions/download-artifact@v4
        with:
          path: ${{ runner.temp }}/digests
          pattern: digests-*
          merge-multiple: true
      - name: Create manifest list and push
        working-directory: ${{ runner.temp }}/digests
        env:
          DOCKER_METADATA_OUTPUT_JSON: ${{ steps.meta.outputs.json }}
        run: |
          docker buildx imagetools create \
            $(jq -cr '.tags | map("-t " + .) | join(" ")' <<< "$DOCKER_METADATA_OUTPUT_JSON") \
            $(printf "${IMAGE_REPO}/worker@sha256:%s " *)
